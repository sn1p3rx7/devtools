<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚡ DevTools</h1>
        <p>Małe narzędzia dla programistów</p>
    </header>

    <main>
        <section class="tool">
            <h2>🎨 Generator koloru</h2>
            <div id="colorPreview"></div>
            <p id="colorCode">#000000</p>
            <button onclick="generateColor()">Losuj kolor</button>
            <button onclick="copyColor()">Kopiuj</button>
        </section>

        <section class="tool">
            <h2>🔢 Losowa liczba</h2>
            <p id="randomNumber">0</p>
            <button onclick="randomNumber()">Losuj</button>
        </section>
    </main>

    <footer>
        <p>DevTools v0.1</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
